name: Starter-kit parser contracts

on:
  push:
    paths:
      - 'starter-kit/**'
      - '.github/workflows/starter-parser.yml'
  pull_request:
    paths:
      - 'starter-kit/**'
      - '.github/workflows/starter-parser.yml'

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline Groovy parser contracts in isolated container
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work/starter-kit groovy:4.0-jdk17 groovy tests/ParserContractTest.groovy
